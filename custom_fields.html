<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Custom Fields — Apex Agents</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #0a0a0f;
            --bg-secondary: #13131a;
            --bg-tertiary: #1c1c26;
            --text-primary: #e5e4e2;
            --text-secondary: #8e8e93;
            --accent-primary: #9D4EDD;
            --accent-purple: #9d4edd;
            --accent-pink: #ff2d7a;
            --border: #2a2a35;
            --success: #10b981;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.6;
        }

        .container {
            display: flex;
            min-height: 100vh;
        }

        /* Sidebar */
        .sidebar {
            width: 240px;
            background: var(--bg-secondary);
            border-right: 1px solid var(--border);
            padding: 24px 0;
            position: fixed;
            height: 100vh;
            overflow-y: auto;
        }

        .sidebar-header {
            padding: 0 20px 24px;
            border-bottom: 1px solid var(--border);
            margin-bottom: 24px;
        }

        .logo {
            font-size: 18px;
            font-weight: 700;
            background: linear-gradient(135deg, var(--accent-purple), var(--accent-purple));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .nav-link {
            padding: 12px 20px;
            color: var(--text-secondary);
            text-decoration: none;
            display: block;
            transition: all 250ms ease;
            border-left: 3px solid transparent;
        }

        .nav-link:hover {
            color: var(--text-primary);
            border-left-color: var(--accent-purple);
            background: var(--bg-tertiary);
        }

        .nav-link.active {
            color: var(--text-primary);
            border-left-color: var(--accent-pink);
            background: var(--bg-tertiary);
        }

        /* Main Content */
        .main {
            margin-left: 240px;
            flex: 1;
            padding: 40px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 40px;
            padding-bottom: 24px;
            border-bottom: 1px solid var(--border);
        }

        .page-title {
            font-size: 32px;
            font-weight: 700;
        }

        .btn {
            padding: 10px 24px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 250ms ease;
            text-decoration: none;
            display: inline-block;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--accent-purple), #c724ff);
            color: white;
            box-shadow: 0 0 20px rgba(157, 78, 221, 0.3);
        }

        .btn-primary:hover {
            box-shadow: 0 0 30px rgba(157, 78, 221, 0.5), 0 0 40px rgba(199, 36, 255, 0.2);
            transform: translateY(-2px);
        }

        /* Content Grid */
        .content {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 24px;
        }

        .card {
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 24px;
            backdrop-filter: blur(10px);
            transition: all 250ms ease;
        }

        .card:hover {
            border-color: var(--accent-purple);
            box-shadow: 0 0 30px rgba(157, 78, 221, 0.15);
        }

        .card-title {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 24px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .card-icon {
            width: 28px;
            height: 28px;
            border-radius: 8px;
            background: rgba(157, 78, 221, 0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--accent-purple);
            font-size: 16px;
        }

        /* Field List */
        .field-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .field-item {
            background: var(--bg-tertiary);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 250ms ease;
        }

        .field-item:hover {
            border-color: var(--accent-purple);
            background: rgba(157, 78, 221, 0.05);
        }

        .field-info {
            flex: 1;
        }

        .field-name {
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 4px;
        }

        .field-type {
            font-size: 12px;
            color: var(--text-secondary);
            display: flex;
            gap: 8px;
        }

        .field-type span {
            background: var(--bg-secondary);
            padding: 2px 8px;
            border-radius: 4px;
        }

        .field-actions {
            display: flex;
            gap: 8px;
        }

        .icon-btn {
            width: 32px;
            height: 32px;
            border: none;
            background: var(--bg-secondary);
            color: var(--text-secondary);
            border-radius: 6px;
            cursor: pointer;
            transition: all 250ms ease;
            font-size: 14px;
        }

        .icon-btn:hover {
            background: var(--accent-purple);
            color: white;
        }

        /* Form Section */
        .form-section {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .form-label {
            font-size: 12px;
            font-weight: 600;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .form-input,
        .form-select {
            padding: 10px 12px;
            background: var(--bg-tertiary);
            border: 1px solid var(--border);
            border-radius: 6px;
            color: var(--text-primary);
            font-size: 13px;
            font-family: inherit;
        }

        .form-input:focus,
        .form-select:focus {
            outline: none;
            border-color: var(--accent-purple);
            box-shadow: 0 0 0 3px rgba(157, 78, 221, 0.1);
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .checkbox {
            width: 20px;
            height: 20px;
            accent-color: var(--accent-purple);
            cursor: pointer;
        }

        /* Options List */
        .options-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-top: 8px;
        }

        .option-input {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .option-input input {
            flex: 1;
            padding: 8px 12px;
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 6px;
            color: var(--text-primary);
            font-size: 13px;
        }

        .option-input button {
            width: 28px;
            height: 28px;
            border: none;
            background: var(--bg-secondary);
            color: var(--text-secondary);
            border-radius: 4px;
            cursor: pointer;
            transition: all 200ms ease;
            font-size: 12px;
        }

        .option-input button:hover {
            background: var(--accent-pink);
            color: white;
        }

        .add-option-btn {
            width: 100%;
            padding: 8px;
            background: var(--bg-tertiary);
            border: 1px dashed var(--border);
            color: var(--text-secondary);
            border-radius: 6px;
            cursor: pointer;
            transition: all 200ms ease;
            font-size: 13px;
        }

        .add-option-btn:hover {
            border-color: var(--accent-purple);
            color: var(--accent-purple);
        }

        /* Buttons */
        .form-actions {
            display: flex;
            gap: 12px;
            margin-top: 24px;
        }

        .btn-save {
            flex: 1;
            background: linear-gradient(135deg, var(--accent-purple), #c724ff);
            color: white;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 250ms ease;
            box-shadow: 0 0 20px rgba(157, 78, 221, 0.3);
        }

        .btn-save:hover {
            box-shadow: 0 0 30px rgba(157, 78, 221, 0.5);
            transform: translateY(-2px);
        }

        .btn-cancel {
            flex: 1;
            background: var(--bg-tertiary);
            color: var(--text-primary);
            padding: 12px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 200ms ease;
        }

        .btn-cancel:hover {
            border-color: var(--accent-purple);
            background: rgba(157, 78, 221, 0.1);
        }

        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: var(--text-secondary);
        }

        .empty-icon {
            font-size: 48px;
            margin-bottom: 16px;
        }

        .empty-text {
            margin-bottom: 16px;
        }

        /* Stats */
        .stats-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
        }

        .stat-card {
            background: var(--bg-tertiary);
            border-radius: 8px;
            padding: 16px;
            text-align: center;
        }

        .stat-value {
            font-size: 24px;
            font-weight: 700;
            color: var(--accent-purple);
            margin-bottom: 4px;
        }

        .stat-label {
            font-size: 12px;
            color: var(--text-secondary);
        }

        /* Responsive */
        @media (max-width: 1200px) {
            .content {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 768px) {
            .sidebar {
                width: 60px;
                padding: 12px 0;
            }

            .nav-link {
                padding: 12px;
                text-align: center;
                font-size: 0;
            }

            .main {
                margin-left: 60px;
                padding: 24px;
            }

            .field-item {
                flex-direction: column;
                align-items: flex-start;
                gap: 12px;
            }

            .field-actions {
                width: 100%;
            }
        }

        /* Animations */
        @keyframes slideInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .card {
            animation: slideInUp 500ms ease forwards;
        }

        .card:nth-child(2) {
            animation-delay: 100ms;
        }

        .field-item {
            animation: slideInUp 500ms ease forwards;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="logo">Apex</div>
            </div>
            <nav>
                <a href="account_dashboard_premium.html" class="nav-link">Dashboard</a>
                <a href="batch_import.html" class="nav-link">Batch Import</a>
                <a href="#" class="nav-link active">Custom Fields</a>
                <a href="#" class="nav-link">Scoring</a>
                <a href="#" class="nav-link">Email Tracking</a>
                <a href="#" class="nav-link">Slack</a>
                <a href="#" class="nav-link">Settings</a>
            </nav>
        </aside>

        <!-- Main Content -->
        <main class="main">
            <div class="header">
                <h1 class="page-title">Custom Fields</h1>
                <button class="btn btn-primary" onclick="openFieldModal()">+ New Field</button>
            </div>

            <div class="content">
                <!-- Fields List -->
                <div class="card">
                    <div class="card-title">
                        <div class="card-icon">🔧</div>
                        Your Custom Fields
                    </div>
                    <div class="field-list">
                        <div class="field-item">
                            <div class="field-info">
                                <div class="field-name">Decision Timeline</div>
                                <div class="field-type">
                                    <span>select</span>
                                    <span>required</span>
                                </div>
                            </div>
                            <div class="field-actions">
                                <button class="icon-btn" onclick="editField()">✎</button>
                                <button class="icon-btn" onclick="deleteField()">✕</button>
                            </div>
                        </div>

                        <div class="field-item">
                            <div class="field-info">
                                <div class="field-name">Budget Amount</div>
                                <div class="field-type">
                                    <span>number</span>
                                </div>
                            </div>
                            <div class="field-actions">
                                <button class="icon-btn" onclick="editField()">✎</button>
                                <button class="icon-btn" onclick="deleteField()">✕</button>
                            </div>
                        </div>

                        <div class="field-item">
                            <div class="field-info">
                                <div class="field-name">Department</div>
                                <div class="field-type">
                                    <span>select</span>
                                </div>
                            </div>
                            <div class="field-actions">
                                <button class="icon-btn" onclick="editField()">✎</button>
                                <button class="icon-btn" onclick="deleteField()">✕</button>
                            </div>
                        </div>

                        <div class="field-item">
                            <div class="field-info">
                                <div class="field-name">Implementation Date</div>
                                <div class="field-type">
                                    <span>date</span>
                                </div>
                            </div>
                            <div class="field-actions">
                                <button class="icon-btn" onclick="editField()">✎</button>
                                <button class="icon-btn" onclick="deleteField()">✕</button>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Field Creator/Editor -->
                <div class="card">
                    <div class="card-title">
                        <div class="card-icon">➕</div>
                        Create New Field
                    </div>
                    <div class="form-section">
                        <div class="form-group">
                            <label class="form-label">Field Name</label>
                            <input type="text" class="form-input" placeholder="e.g., Decision Timeline" value="">
                        </div>

                        <div class="form-group">
                            <label class="form-label">Field Type</label>
                            <select class="form-select" onchange="updateFieldType(this.value)">
                                <option value="">Select type...</option>
                                <option value="text">Text</option>
                                <option value="number">Number</option>
                                <option value="select">Select (Dropdown)</option>
                                <option value="date">Date</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label class="checkbox-group">
                                <input type="checkbox" class="checkbox">
                                <span>Required field?</span>
                            </label>
                        </div>

                        <!-- Options for Select Type -->
                        <div class="form-group" id="optionsSection" style="display: none;">
                            <label class="form-label">Options</label>
                            <div class="options-list">
                                <div class="option-input">
                                    <input type="text" placeholder="Option 1" value="0-30 days">
                                    <button onclick="removeOption(this)">✕</button>
                                </div>
                                <div class="option-input">
                                    <input type="text" placeholder="Option 2" value="30-90 days">
                                    <button onclick="removeOption(this)">✕</button>
                                </div>
                                <div class="option-input">
                                    <input type="text" placeholder="Option 3" value="90+ days">
                                    <button onclick="removeOption(this)">✕</button>
                                </div>
                            </div>
                            <button class="add-option-btn" onclick="addOption()">+ Add Option</button>
                        </div>

                        <div class="form-actions">
                            <button class="btn-save" onclick="saveField()">Save Field</button>
                            <button class="btn-cancel" onclick="cancelField()">Cancel</button>
                        </div>
                    </div>
                </div>

                <!-- Stats -->
                <div class="card">
                    <div class="card-title">
                        <div class="card-icon">📊</div>
                        Fields Overview
                    </div>
                    <div class="stats-grid">
                        <div class="stat-card">
                            <div class="stat-value">4</div>
                            <div class="stat-label">Total Fields</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-value">1</div>
                            <div class="stat-label">Required</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-value">2</div>
                            <div class="stat-label">Select Fields</div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script>
        function updateFieldType(type) {
            const optionsSection = document.getElementById('optionsSection');
            if (type === 'select') {
                optionsSection.style.display = 'block';
            } else {
                optionsSection.style.display = 'none';
            }
        }

        function openFieldModal() {
            console.log('Opening field creator modal');
        }

        function editField() {
            console.log('Editing field');
        }

        function deleteField() {
            if (confirm('Are you sure? This cannot be undone.')) {
                console.log('Deleting field');
            }
        }

        function saveField() {
            console.log('Saving field');
        }

        function cancelField() {
            console.log('Canceling');
        }

        function addOption() {
            const optionsList = document.querySelector('.options-list');
            const optionCount = optionsList.querySelectorAll('.option-input').length + 1;
            const newOption = document.createElement('div');
            newOption.className = 'option-input';
            newOption.innerHTML = `
                <input type="text" placeholder="Option ${optionCount}">
                <button onclick="removeOption(this)">✕</button>
            `;
            optionsList.insertBefore(newOption, optionsList.lastElementChild);
        }

        function removeOption(btn) {
            btn.parentElement.remove();
        }
    </script>
</body>
</html>
